name: Build JAR (Maven)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        # Note: Using -Dmaven.test.skip=true instead of -DskipTests because
        # test files have compilation errors. This skips both test compilation
        # and execution to ensure the build succeeds and JAR is created.
        run: mvn -B -Dmaven.test.skip=true clean package

      - name: Verify JAR exists
        run: |
          if [ ! -d target ] || ! ls target/*.jar 1> /dev/null 2>&1; then
            echo "Error: No JAR files found in target/ directory"
            exit 1
          fi
          echo "JAR files found:"
          ls -lh target/*.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: qlvetau-jar
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error
